<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch</title>
</head>
<body>
    <h1>사용자 목록</h1>
    <!-- 사용자 목록(ul)이 출력될 영역 -->
    <div id="app"></div>

    <script type="module">
        // API 기본 주소 (상수로 분리해 변경 시 한 곳만 수정)
        const API_URL = 'https://jsonplaceholder.typicode.com/users';

        // [재사용 함수 1] 범용 GET 요청 함수
        // - url을 받아 fetch로 요청하고 JSON으로 변환해 반환
        // - response.ok가 false(404, 500 등)이면 에러를 던져 호출부에서 처리하도록 함
        async function fetchData(url) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP 오류: ${response.status}`);
            }
            return await response.json();
        }

        // [재사용 함수 2] 배열 데이터를 ul > li 목록으로 렌더링하는 함수
        // - items: 출력할 데이터 배열
        // - formatItem: 각 항목을 li에 들어갈 문자열로 바꾸는 콜백 (출력 형식을 자유롭게 변경 가능)
        // - textContent를 사용해 XSS(스크립트 삽입)를 방지
        function renderList(container, items, formatItem) {
            const ul = document.createElement('ul');
            items.forEach(item => {
                const li = document.createElement('li');
                li.textContent = formatItem(item);
                ul.appendChild(li);
            });
            container.replaceChildren(ul); // 기존 내용을 지우고 새 목록으로 교체
        }

        // [실행 함수] 사용자 목록을 가져와 화면에 출력
        // - 로딩 메시지 표시 → 데이터 요청(await) → 이름/이메일 목록 렌더링
        // - try/catch로 네트워크/HTTP 오류를 잡아 화면에 표시
        async function showUsers() {
            const app = document.getElementById('app');
            app.textContent = '불러오는 중...';
            try {
                const users = await fetchData(API_URL);
                renderList(app, users, user => `${user.name} - ${user.email}`);
            } catch (error) {
                app.textContent = `데이터를 불러오지 못했습니다: ${error.message}`;
                console.error(error);
            }
        }

        // 페이지 로드 시 실행
        showUsers();
    </script>
</body>
</html>
